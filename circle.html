<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>le cercle specular</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: monospace; font-size: 18px; line-height: 1.45; color: #000; }
  #circle { display: table; width: auto; max-width: 90vw; margin-left: auto; margin-right: auto; text-align: left; }
  .entry { margin: 0 0 0.35em 0; }
  .author { font-weight: 700; }
  .text { display: block; margin-left: 0; }
  .error { opacity: 0.55; color: #c00; }
  @media (max-width: 600px) {
    body { font-size: 14px; line-height: 1.35; }
    #circle { max-width: 94vw; }
  }
</style>
</head>
<body>
<div id="circle" aria-live="polite"></div>
<script>
const SEQUENCE = 'https://raw.githubusercontent.com/robiniklaas/lecerclespecularlivetest/main/circle_daily.json';

async function loadCircle() {
  const container = document.getElementById('circle');
  try {
    const response = await fetch(SEQUENCE + '?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!Array.isArray(data.turns) || data.turns.length !== 80) throw new Error('Séquence incomplète');

    // Preserve the existing public format: display only four utterances.
    const entries = [];
    const seenVoices = new Set();
    for (const turn of data.turns) {
      for (const entry of (turn.entries || [])) {
        if (seenVoices.has(entry.voice)) continue;
        entries.push(entry);
        seenVoices.add(entry.voice);
        if (entries.length === 4) break;
      }
      if (entries.length === 4) break;
    }
    if (entries.length !== 4) throw new Error('Quatre voix distinctes indisponibles');
    container.innerHTML = entries.map(entry =>
      '<div class="entry"><span class="author">' + escapeHtml(entry.voice || '') +
      '</span><span class="text">' + escapeHtml(entry.text || '') + '</span></div>'
    ).join('');
  } catch (error) {
    container.innerHTML = '<div class="error">[live]</div>';
    console.error('Cercle Specular:', error);
  }
}
function escapeHtml(value) {
  return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}
loadCircle();
setInterval(loadCircle, 15 * 60 * 1000);
</script>
</body>
</html>

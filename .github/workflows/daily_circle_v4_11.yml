name: Daily Cercle Specular V4.11 expérimentale

on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate public V4.11 sequence
        run: python generate_circle_daily_v4_11.py

      - name: Commit public sequence and V4.11 archive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add circle_daily.json observations_v4_11/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Publish daily V4.11 experimental Circle sequence"
          git pull --rebase origin main
          git push origin HEAD:main

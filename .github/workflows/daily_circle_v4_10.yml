name: Rollback — Daily Cercle Specular V4.10 forte (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate balanced V4.10 forte sequence
        run: python generate_circle_daily.py

      - name: Commit rollback sequence and V4.10 archive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add circle_daily.json observations_v4_10_forte/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Rollback public Circle sequence to V4.10 forte"
          git pull --rebase origin main
          git push origin HEAD:main

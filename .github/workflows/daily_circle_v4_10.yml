name: Daily Cercle Specular V4.10 forte

on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate balanced daily sequence
        run: python generate_circle_daily.py

      - name: Commit public sequence and daily archive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add circle_daily.json observations_v4_10_forte/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Publish daily V4.10 forte Circle sequence"
          git pull --rebase origin main
          git push origin HEAD:main
